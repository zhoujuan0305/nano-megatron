[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-megatron"
version = "0.1.0"
description = "Compact distributed training framework studying Megatron-style parallelism"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_megatron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
